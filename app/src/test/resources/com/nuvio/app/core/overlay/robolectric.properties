# Scoped to `com.nuvio.app.core.overlay` ONLY (Robolectric walks the package hierarchy
# for `robolectric.properties`, so this file applies to the ported overlay host tests
# and to nothing else in the module).
#
# Robolectric's `AndroidTestEnvironment.setUpApplicationState` installs Conscrypt's
# `OpenSSLProvider` into the test JVM unless this is OFF. The overlay tests never need
# TLS, and on this module the Conscrypt that wins the classpath is
# `org.conscrypt:conscrypt-android` (inherited from `fullImplementation`), whose
# `NativeCryptoJni` calls `System.loadLibrary("conscrypt_jni")` -- resolvable only
# against an APK's `jniLibs/`, never on a JVM. Simply *installing* that provider kills
# every test in the package before its first assertion:
#
#     UnsatisfiedLinkError: no conscrypt_jni in java.library.path
#
# which reads as 216 unrelated failures and is not one of them.
#
# Turning Conscrypt off here is deliberately narrow: the module's other tests keep the
# provider Robolectric would otherwise install, so their behaviour is unchanged from
# the pristine baseline (see the note in app/build.gradle.kts -- an earlier
# classpath-wide fix here broke SubtitleCredentialScopeTest).
conscryptMode=OFF
